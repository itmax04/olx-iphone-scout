# Render Blueprint: web + worker + PostgreSQL 17 (§18.4).
# Реальные секреты сюда не помещаются: sync:false / generateValue / fromDatabase.
envVarGroups:
  - name: olx-scout-common
    envVars:
      - key: APP_ENV
        value: production
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_DEBUG
        value: "false"
      - key: TIME_ZONE
        value: Europe/Kyiv
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: DB_CONN_MAX_AGE
        value: "60"
      - key: MONITOR_ENABLED
        value: "false"
      - key: WORKER_POLL_SECONDS
        value: "5"
      - key: OUTBOX_POLL_SECONDS
        value: "5"
      - key: WORKER_HEARTBEAT_SECONDS
        value: "30"
      - key: OLX_ALLOWED_HOSTS
        value: olx.ua,www.olx.ua
      - key: OLX_MIN_INTERVAL_SECONDS
        value: "60"
      - key: OLX_DEFAULT_INTERVAL_SECONDS
        value: "90"
      - key: OLX_DEFAULT_JITTER_SECONDS
        value: "15"
      - key: OLX_MAX_CARDS_PER_SCAN
        value: "50"
      - key: OLX_MAX_CONCURRENCY
        value: "1"
      - key: OLX_NAVIGATION_TIMEOUT_MS
        value: "25000"
      - key: OLX_BROWSER_RESTART_AFTER_SCANS
        value: "100"
      - key: PLAYWRIGHT_HEADLESS
        value: "true"
      - key: AI_ENABLED
        value: "false"
      - key: OPENAI_FAST_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_DEEP_MODEL
        value: gpt-5.6-terra
      - key: OPENAI_REASONING_EFFORT
        value: low
      - key: OPENAI_TIMEOUT_SECONDS
        value: "30"
      - key: OPENAI_MAX_RETRIES
        value: "2"
      - key: AI_INPUT_MAX_CHARS
        value: "12000"
      - key: AI_SCHEMA_VERSION
        value: "1"
      - key: AI_PROMPT_VERSION
        value: iphone-risk-v1
      - key: OPENAI_FAST_INPUT_USD_PER_MILLION
        value: "1.00"
      - key: OPENAI_FAST_OUTPUT_USD_PER_MILLION
        value: "6.00"
      - key: OPENAI_DEEP_INPUT_USD_PER_MILLION
        value: "2.50"
      - key: OPENAI_DEEP_OUTPUT_USD_PER_MILLION
        value: "15.00"
      - key: OPENAI_PRICING_VERIFIED_AT
        value: "2026-07-24"
      - key: AI_DAILY_HARD_LIMIT_USD
        value: "1.00"
      - key: AI_MONTHLY_HARD_LIMIT_USD
        value: "10.00"
      - key: TELEGRAM_TIMEOUT_SECONDS
        value: "15"
      - key: AXES_FAILURE_LIMIT
        value: "5"
      - key: AXES_COOLOFF_MINUTES
        value: "15"
      - key: SECURE_SSL_REDIRECT
        value: "true"

services:
  - type: web
    name: olx-scout-web
    runtime: docker
    branch: main
    region: frankfurt
    plan: starter
    numInstances: 1
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: ./scripts/render_start_web.sh
    preDeployCommand: ./scripts/render_predeploy.sh
    healthCheckPath: /api/v1/health/ready/
    maxShutdownDelaySeconds: 60
    envVars:
      - fromGroup: olx-scout-common
      - key: DATABASE_URL
        fromDatabase:
          name: olx-scout-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: olx-scout-web.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://olx-scout-web.onrender.com
      - key: APP_BASE_URL
        fromService:
          type: web
          name: olx-scout-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: WEB_CONCURRENCY
        value: "2"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

  - type: worker
    name: olx-scout-worker
    runtime: docker
    branch: main
    region: frankfurt
    plan: standard
    numInstances: 1
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: ./scripts/render_start_worker.sh
    maxShutdownDelaySeconds: 120
    envVars:
      - fromGroup: olx-scout-common
      - key: DATABASE_URL
        fromDatabase:
          name: olx-scout-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: olx-scout-web
          envVarKey: DJANGO_SECRET_KEY
      - key: DJANGO_ALLOWED_HOSTS
        value: olx-scout-web.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://olx-scout-web.onrender.com
      - key: APP_BASE_URL
        fromService:
          type: web
          name: olx-scout-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: OPENAI_API_KEY
        fromService:
          type: web
          name: olx-scout-web
          envVarKey: OPENAI_API_KEY
      - key: TELEGRAM_BOT_TOKEN
        fromService:
          type: web
          name: olx-scout-web
          envVarKey: TELEGRAM_BOT_TOKEN
      - key: TELEGRAM_CHAT_ID
        fromService:
          type: web
          name: olx-scout-web
          envVarKey: TELEGRAM_CHAT_ID

databases:
  - name: olx-scout-db
    databaseName: iphone_scout
    user: iphone_scout
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "17"
    ipAllowList: []
