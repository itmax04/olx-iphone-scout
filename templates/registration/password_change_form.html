{% extends "base.html" %}
{% block title %}Смена пароля — OLX iPhone Scout{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-5">
    <h1 class="h4 mb-3">Смена пароля</h1>
    <div class="card">
      <div class="card-body p-4">
        {% include "includes/field_errors.html" %}
        <form method="post" novalidate>
          {% csrf_token %}
          <div class="mb-3">
            <label for="{{ form.old_password.auto_id }}" class="form-label">Текущий пароль</label>
            <input type="password" name="old_password" id="{{ form.old_password.auto_id }}"
                   class="form-control" autocomplete="current-password" required>
          </div>
          <div class="mb-3">
            <label for="{{ form.new_password1.auto_id }}" class="form-label">Новый пароль (минимум 12 символов)</label>
            <input type="password" name="new_password1" id="{{ form.new_password1.auto_id }}"
                   class="form-control" autocomplete="new-password" required>
          </div>
          <div class="mb-3">
            <label for="{{ form.new_password2.auto_id }}" class="form-label">Повторите новый пароль</label>
            <input type="password" name="new_password2" id="{{ form.new_password2.auto_id }}"
                   class="form-control" autocomplete="new-password" required>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary"><span class="btn-label">Сменить пароль</span></button>
            <a href="{% url 'dashboard:index' %}" class="btn btn-outline-secondary">Отмена</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
