{% if page_obj.paginator.num_pages > 1 %}
<nav aria-label="Постраничная навигация">
  <ul class="pagination flex-wrap">
    <li class="page-item {% if not page_obj.has_previous %}disabled{% endif %}">
      <a class="page-link" href="?{{ query_string }}&page={{ page_obj.previous_page_number|default:1 }}"
         aria-label="Предыдущая">‹</a>
    </li>
    <li class="page-item disabled">
      <span class="page-link">Стр. {{ page_obj.number }} из {{ page_obj.paginator.num_pages }}</span>
    </li>
    <li class="page-item {% if not page_obj.has_next %}disabled{% endif %}">
      <a class="page-link"
         href="?{{ query_string }}&page={% if page_obj.has_next %}{{ page_obj.next_page_number }}{% else %}{{ page_obj.paginator.num_pages }}{% endif %}"
         aria-label="Следующая">›</a>
    </li>
  </ul>
</nav>
{% endif %}
