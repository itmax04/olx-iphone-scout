<div class="card">
  <div class="card-body text-center py-5">
    <h5 class="mb-2">{{ empty_title|default:"Данных пока нет" }}</h5>
    <p class="text-muted mb-3">{{ empty_text|default:"" }}</p>
    {% if empty_action_url and empty_action_label %}
      <a href="{{ empty_action_url }}" class="btn btn-primary">{{ empty_action_label }}</a>
    {% endif %}
  </div>
</div>
