name: olx-iphone-scout

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iphone_scout}
      POSTGRES_USER: ${POSTGRES_USER:-iphone_scout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iphone_scout} -d ${POSTGRES_DB:-iphone_scout}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://iphone_scout:change_me_local_only@db:5432/iphone_scout}
    command: >
      bash -c "python manage.py migrate --noinput && python manage.py bootstrap_admin"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://iphone_scout:change_me_local_only@db:5432/iphone_scout}
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://iphone_scout:change_me_local_only@db:5432/iphone_scout}
    command: python manage.py run_monitor
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
