[project]
name = "olx-iphone-scout"
version = "1.0.0"
description = "Private OLX iPhone monitoring and resale dashboard"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.15.2,<3.18",
    "psycopg[binary]>=3.2,<3.4",
    "django-environ>=0.11,<0.15",
    "playwright>=1.49,<2",
    "openai>=1.59,<3",
    "pydantic>=2.9,<3",
    "django-htmx>=1.19,<2",
    "whitenoise>=6.7,<7",
    "gunicorn>=23,<27",
    "httpx>=0.27,<1",
    "tenacity>=9,<10",
    "argon2-cffi>=23.1,<26",
    "django-axes[ipware]>=7.0,<9",
    "django-csp>=4.0,<5",
    "beautifulsoup4>=4.12,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-django>=4.9,<5",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<0.17",
    "mypy>=1.13,<2",
    "django-stubs>=5.1,<6",
    "freezegun>=1.5,<2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B904"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["apps"]
# Исключения задокументированы в docs/ARCHITECTURE_DECISIONS.md:
# playwright_source и CLI-обертки исполняются только против живого OLX,
# который запрещен в автоматических тестах.
omit = [
    "*/migrations/*",
    "*/management/commands/run_monitor.py",
    "*/management/commands/run_search_once.py",
    "*/management/commands/refresh_listing.py",
    "apps/monitoring/collectors/playwright_source.py",
    "apps/monitoring/collectors/base.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = false
skip_covered = true

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
disallow_untyped_defs = false
exclude = "(migrations)/"

[tool.django-stubs]
django_settings_module = "config.settings.test"
